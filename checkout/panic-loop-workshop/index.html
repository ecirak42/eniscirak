<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0; url=https://square.link/u/NtyClaJI?src=embed" />
  <title>Redirecting to Checkout | Panic Loop Workshop</title>
  <script>
    window.location.replace("https://square.link/u/NtyClaJI?src=embed");
  </script>
  <style>
    :root {
      --paper: #F5F1E8;
      --surface: #FFFDF6;
      --ink: #22251F;
      --ink-2: #45493F;
      --line: #DAD0BC;
      --clay: #9E5230;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 38rem);
      padding: clamp(1.5rem, 4vw, 2.5rem);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    p {
      margin: 1rem 0 0;
      color: var(--ink-2);
    }

    a {
      display: inline-flex;
      min-height: 3rem;
      align-items: center;
      justify-content: center;
      margin-top: 1.5rem;
      padding: 0.85rem 1.15rem;
      border-radius: 999px;
      background: var(--clay);
      color: var(--surface);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Redirecting to Square checkout.</h1>
    <p>If you are not redirected automatically, use the button below.</p>
    <a href="https://square.link/u/NtyClaJI?src=embed">Continue to secure checkout</a>
  </main>
</body>
</html>
